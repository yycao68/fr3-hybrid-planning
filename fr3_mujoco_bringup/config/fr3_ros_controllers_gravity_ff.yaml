# Goal-execution-fragility oscillation fix (fourth pass, see
# ros2_ws/src/README.md's "Known environmental gaps"): same as
# fr3_ros_controllers.yaml, except fr3_arm_controller's own type is
# fr3_gravity_ff_controller/GravityFeedforwardController instead of the
# stock joint_trajectory_controller/JointTrajectoryController -- adds
# gravity+Coriolis feedforward (via fr3_dynamics) on top of the SAME
# per-joint P/D gains, so the pure-PD loop doesn't have to source static
# gravity-holding torque from tracking error alone. A SEPARATE file
# (rather than editing fr3_ros_controllers.yaml in place) so every
# existing result stays reproducible against the stock controller by
# default -- select this one via FR3_ARM_CONTROLLER_YAML.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz

      fr3_arm_controller:
        type: fr3_gravity_ff_controller/GravityFeedforwardController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

/**:
  fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
      root_link: "fr3_link0"
      tip_link: "fr3_link8"
      # i/i_clamp added after finding pure PD (i:0, matching the stock
      # controller's own gains) leaves a persistent steady-state error --
      # confirmed live: every joint plateaus at a fixed nonzero error once
      # the reference route completes, with NO further progress even
      # after 100+s (joint7: constant 4.06 N*m, well under its 12 N*m
      # budget, with velocity/position numerically frozen). i_clamp bounds
      # the INTEGRAL TERM's own torque contribution (see
      # GravityFeedforwardController's own header comment), not the raw
      # accumulated error -- same semantic as this same file's stock
      # counterpart already carries (unused there since i was always 0).
      gains:
        fr3_joint1: { p: 300., d: 30., i: 5., i_clamp: 10. }
        fr3_joint2: { p: 300., d: 30., i: 5., i_clamp: 10. }
        fr3_joint3: { p: 300., d: 30., i: 5., i_clamp: 10. }
        fr3_joint4: { p: 300., d: 30., i: 5., i_clamp: 10. }
        fr3_joint5: { p: 50., d: 5., i: 3., i_clamp: 4. }
        fr3_joint6: { p: 30., d: 5., i: 2., i_clamp: 3. }
        fr3_joint7: { p: 10., d: 3., i: 1., i_clamp: 3. }
