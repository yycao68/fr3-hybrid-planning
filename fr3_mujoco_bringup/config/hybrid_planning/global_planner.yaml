# Adapted verbatim from moveit_hybrid_planning's own stock test/config/global_planner.yaml
# -- no FR3-specific values needed here, it's generic moveit_cpp config.
global_planner_name: "moveit_hybrid_planning/MoveItPlanningPipeline"

planning_scene_monitor_options:
  name: "planning_scene_monitor"
  robot_description: "robot_description"
  joint_state_topic: "/joint_states"
  attached_collision_object_topic: "/moveit_cpp/planning_scene_monitor"
  publish_planning_scene_topic: "/planning_scene"
  monitored_planning_scene_topic: "/global_planner/planning_scene"
  wait_for_initial_state_timeout: 10.0
planning_pipelines:
  pipeline_names: ["ompl"]
plan_request_params:
  planning_attempts: 1
  planning_pipeline: ompl
  max_velocity_scaling_factor: 0.5
  max_acceleration_scaling_factor: 0.5
