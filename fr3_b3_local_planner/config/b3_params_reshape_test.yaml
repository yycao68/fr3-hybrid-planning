# TEST-ONLY, artificially reduced tau_max for wrist joints (5-7; real:
# 12.0), joints 1-4 kept real (never binding). Tuned empirically against a
# large/fast move's real dynamics (Phase 3c plan) to exercise online
# Level 2 (reshape) over the bounded per-cycle horizon. Verified finding
# (see Phase 3c summary): the reshape QP's own hard constraint only
# targets |tau| <= tau_max - delta_tau, not m_safe, so it reliably
# reduces a genuine hard-constraint violation (confirmed via independent
# re-verification, not just trusting OSQP's own status) but does not
# always fully restore the SEPARATE m_safe safety buffer on the first
# attempt at this scale -- Level 4 correctly remains the safety net when
# it doesn't. This value reproduces a genuine, measurable partial
# improvement (m0 -> reshaped margin, both logged), not a full recovery.
b3:
  root_link: "fr3_link0"
  tip_link: "payload"  # Phase 4b: payload_joint (fixed) child of fr3_link8, see fr3_mujoco.urdf.xacro
  dt: 0.02
  horizon_steps: 15
  m_safe: 0.01
  qddot_box: 8.0
  delta_tau_fraction: 0.05
  lam_max: 4.0
  reshape_w_acc: 1.0
  reshape_w_pos: 0.1
  reshape_w_vel: 0.1
  tau_max:
    fr3_joint1: 87.0
    fr3_joint2: 87.0
    fr3_joint3: 87.0
    fr3_joint4: 87.0
    fr3_joint5: 1.50
    fr3_joint6: 1.50
    fr3_joint7: 1.50
