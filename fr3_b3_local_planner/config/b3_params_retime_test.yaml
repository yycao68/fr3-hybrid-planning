# TEST-ONLY, artificially reduced tau_max for joints 1-4 (real: 87.0),
# joints 5-7 kept at their real values (12.0, never binding in this
# scenario). Tuned empirically (see Phase 3b plan) against a large/fast
# move's ACTUAL whole-route dynamics: at this scale, the binding joint's
# torque decomposes as roughly A/lambda^2 + B with A~2.0, B~25.8 N*m, so
# nominal-speed (lambda=1) whole-route margin is negative (violates) while
# a ~4x slower replay (lambda close to lam_max) is comfortably positive
# (clears) -- a genuine velocity-dependent deficit, unlike
# b3_params_test_low.yaml's pure gravity/static deficit (which retiming
# cannot fix by construction, since B alone is lambda-independent).
b3:
  root_link: "fr3_link0"
  tip_link: "payload"  # Phase 4b: payload_joint (fixed) child of fr3_link8, see fr3_mujoco.urdf.xacro
  dt: 0.02
  horizon_steps: 15
  m_safe: 0.5
  qddot_box: 8.0
  delta_tau_fraction: 0.05
  lam_max: 4.0
  tau_max:
    fr3_joint1: 28.5
    fr3_joint2: 28.5
    fr3_joint3: 28.5
    fr3_joint4: 28.5
    fr3_joint5: 12.0
    fr3_joint6: 12.0
    fr3_joint7: 12.0
