# TEST-ONLY, same wrist-joint tau_max deficit as b3_params_reshape_test.yaml
# (real: 12.0, reduced here to exercise a genuine, previously-confirmed
# Level-1-and-Level-2-both-fail case at the ROUTE level). via_point_offset
# is Phase 3d's own CALLER-CONFIGURED alternate-route candidate (not
# searched for) -- see Phase 3d plan/README for why this is deliberately
# not a general rerouting algorithm.
#
# Verified finding (6 empirical trials, several offset directions/
# magnitudes on single and combined joints): for THIS deficit, the
# via-point route's own stop-and-go shape (full stop at q_via, then
# re-accelerate, within the SAME total duration as the primary route)
# consistently makes the margin worse, not better -- the extra peak
# acceleration the stop-and-go profile demands outweighs whatever
# gravity-loading benefit any tried via-point offered. Even retiming the
# alternate up to lam_max=4.0 (sub-level 1) could not recover it, which
# is itself informative: the alternate's own deficit at this via-point is
# gravity- (not just velocity-) dominated too. This is a genuine,
# reproducible property of this scenario, not a bug -- the mechanism
# itself (candidate construction, margin evaluation, retime/reshape
# cascade on the alternate, correct fallthrough when all three sub-levels
# fail) is confirmed working correctly end-to-end in every trial: no
# crash, no silent wrong answer, ever.
b3:
  root_link: "fr3_link0"
  tip_link: "payload"  # Phase 4b: payload_joint (fixed) child of fr3_link8, see fr3_mujoco.urdf.xacro
  dt: 0.02
  horizon_steps: 15
  m_safe: 0.01
  qddot_box: 8.0
  delta_tau_fraction: 0.05
  lam_max: 4.0
  reshape_w_acc: 1.0
  reshape_w_pos: 0.1
  reshape_w_vel: 0.1
  via_t1_fraction: 0.5
  via_point_offset:
    fr3_joint1: 0.0
    fr3_joint2: -0.4
    fr3_joint3: 0.0
    fr3_joint4: -0.4
    fr3_joint5: 0.0
    fr3_joint6: -0.4
    fr3_joint7: 0.0
  tau_max:
    fr3_joint1: 87.0
    fr3_joint2: 87.0
    fr3_joint3: 87.0
    fr3_joint4: 87.0
    fr3_joint5: 1.50
    fr3_joint6: 1.50
    fr3_joint7: 1.50
